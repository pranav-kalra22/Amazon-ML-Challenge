model_name: "lightgbm_binary_matcher_v01"
objective: "binary"
metric: "binary_logloss"
boosting_type: "gbdt"

hyperparameters:
  learning_rate: 0.05
  num_leaves: 63
  max_depth: 8
  min_data_in_leaf: 50
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  n_estimators: 500
  random_state: 42
  n_jobs: -1

training:
  early_stopping_rounds: 30
  negative_ratio: 5
  stratify_groups_by: "source1_entity_id"
